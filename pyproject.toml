[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "workforce-assistant"
version = "0.1.0"
description = "A workforce analytics assistant for leaders: text-to-SQL with access scoping, small-group suppression and answer verification."
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.1",
    "numpy>=1.26",
    "duckdb>=1.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]
snowflake = ["snowflake-connector-python[pandas]>=3.10", "python-dotenv>=1.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
